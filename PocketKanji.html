 }
 clean.history=v.history.map(h=>{if(!h||!BY_ID.has(h.id)||!['again','hard','good'].includes(h.rating)||!Number.isFinite(h.at)||h.at<0||h.at>8640000000000000)throw Error('Cronologia non valida.');return {id:h.id,rating:h.rating,at:h.at};});

function voiceScore(v){const name=v.name.toLowerCase();let score=v.localService?20:0;if(/premium|enhanced|siri|neural|natural/.test(name))score+=100;if(/kyoko|nanami|haruka|ayumi/.test(name))score+=60;if(/google/.test(name))score+=35;if(/otoya/.test(name))score-=20;return score;}
function selectedJapaneseVoice(){const voices=japaneseVoices(),saved=voices.find(v=>v.voiceURI===data.settings.voiceURI);return saved||voices.sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;}
function populateVoiceSelect(){const select=$('#voice-select');if(!select)return;const voices=japaneseVoices().sort((a,b)=>voiceScore(b)-voiceScore(a)||a.name.localeCompare(b.name)),current=data.settings.voiceURI;select.innerHTML='<option value="">Automatica · consigliata</option>'+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===current?'selected':''}>${esc(v.name)}${v.localService?' · sul Mac':''}</option>`).join('');select.disabled=!voices.length;const note=$('#voice-note');if(note)note.textContent=voices.length?'La modalità automatica preferisce le voci naturali installate sul Mac.':'Nessuna voce giapponese installata: aggiungila nelle impostazioni Voce del Mac.';}
function speakJapanese(text,button){if(!speechAvailable()){toast('La voce non è disponibile in questo browser.');return;}const voice=selectedJapaneseVoice();if(!voice){toast('Installa una voce giapponese sul Mac: non userò una voce di un’altra lingua.');return;}stopSpeech();const utterance=new window.SpeechSynthesisUtterance(text);utterance.lang='ja-JP';utterance.rate=.9;utterance.pitch=1.05;utterance.volume=1;utterance.voice=voice;speakingButton=button;speakingUtterance=utterance;utterance.onstart=()=>button.classList.add('speaking');utterance.onend=()=>{button.classList.remove('speaking');if(speakingButton===button)speakingButton=null;if(speakingUtterance===utterance)speakingUtterance=null;};utterance.onerror=event=>{button.classList.remove('speaking');if(speakingButton===button)speakingButton=null;if(speakingUtterance===utterance)speakingUtterance=null;if(event.error!=='canceled'&&event.error!=='interrupted')toast('Non è stato possibile riprodurre la pronuncia.');};speechTimer=setTimeout(()=>{speechTimer=null;window.speechSynthesis.resume();window.speechSynthesis.speak(utterance);},80);}
function readingExample(x){return `<div class="reading-example"><span class="reading-example-main"><span><span class="reading-example-word" lang="ja">${highlightRanges(x.word,x.word_highlights)}</span><span class="reading-example-kana" lang="ja">（${highlightRanges(x.reading,x.reading_highlights)}）</span></span>${speakButton(x.reading,`Ascolta ${x.reading}`)}</span><span class="reading-example-meaning" lang="en">${esc(x.meaning_en)}</span>${x.advanced?'<span class="reading-level">Advanced</span>':''}${x.usage_note?`<span class="reading-usage-note">${esc(x.usage_note)}</span>`:''}</div>`;}
function readingBlock(label,readings,kind,examples){return `<section class="reading-block ${kind}" aria-label="${label}"><div class="reading-title">${label}</div>${readings.length?`<div class="reading-list">${readings.map(r=>{const matches=examples.filter(x=>x.kind===kind&&x.reading_kana===r.kana),spoken=kind==='on'?kataToHira(r.kana):r.kana;return `<div class="reading-item"><div class="reading-item-head"><span class="reading-kana" lang="ja">${esc(r.kana)}</span>${data.settings.romaji?`<span class="reading-romaji">${esc(r.romaji)}</span>`:''}${speakButton(spoken,`Ascolta la lettura ${label.toLowerCase()} ${spoken}`)}</div><div class="reading-linked-examples">${matches.map(readingExample).join('')}</div></div>`}).join('')}</div>`:'<span class="reading-empty">Nessuna lettura essenziale selezionata</span>'}</section>`;}
function answer(c){const examples=c.reading_examples||[];const referenceCovered=examples.some(x=>x.word===c.reference_word&&x.reading===c.reference_word_reading_kana);return `<h2 class="answer-meaning" lang="en">${esc(c.meaning_en)}</h2><div class="reading-sections">${readingBlock("KUN'YOMI",c.kun_readings||[],'kun',examples)}${readingBlock("ON'YOMI",c.on_readings||[],'on',examples)}</div>${referenceCovered?'':`<div class="word-line"><span class="reference-word-label">Parola di riferimento</span><span lang="ja">${esc(c.reference_word)}</span> · <span lang="ja">${esc(c.reference_word_reading_kana)}</span>${data.settings.romaji?` · ${esc(c.reference_word_romaji)}`:''}${speakButton(c.reference_word_reading_kana,`Ascolta ${c.reference_word_reading_kana}`)}<br><span lang="en">${esc(c.reference_word_meaning_en)}</span></div>`}<div class="example"><div class="sentence-head"><p class="jp" lang="ja">${highlightRanges(c.example_ja,c.sentence_word_highlights)}</p>${speakButton(c.example_ja,'Ascolta la frase')}</div><p class="kana" lang="ja">${highlightRanges(c.example_kana,c.sentence_reading_highlights)}</p><p class="en" lang="en">${esc(c.example_en)}</p></div>${c.notes_it?`<details><summary>Note</summary><p>${esc(c.notes_it)}</p></details>`:''}`;}
function startSession(scope='all'){const pool=scope==='mustn5'?CARDS.filter(c=>MUST_N5.has(c.kanji)):CARDS;const due=pool.filter(c=>state(c.id).status!=='new'&&state(c.id).due<=Date.now()).sort((a,b)=>state(a.id).due-state(b.id).due).slice(0,20);const newCards=pool.filter(c=>state(c.id).status==='new').slice(0,due.length?0:10);session={queue:[...due,...newCards].map(c=>c.id),index:0,revealed:false,ratings:[],scope};page='study';render();}
function renderStudy(){if(!session)return intro('Richiamo attivo','Il tuo momento di pratica.','Prima i ripassi, poi le nuove carte.')+`<div class="empty"><h2>${dueCards().length?`${dueCards().length} carte da ripassare`:counts().new?'Cominciamo con 10 kanji?':'Sei in pari con i ripassi.'}</h2><p class="prompt">${counts().new||dueCards().length?'Ricorda il significato in inglese e la lettura di riferimento.':'Puoi esplorare la libreria mentre aspetti i prossimi ripassi.'}</p><button class="btn" data-action="start" ${!counts().new&&!dueCards().length?'disabled':''}>Inizia la sessione →</button></div>`;
 if(session.index>=session.queue.length){const n=session.ratings.length,good=session.ratings.filter(r=>r==='good').length,scope=session.scope||'all';return intro('Sessione conclusa',scope==='mustn5'?'MUST N5 completata.':'Un passo avanti.','Ogni incontro rende il prossimo un po’ più familiare.')+`<div class="panel completion"><div class="seal" lang="ja">学</div><h2>Ben fatto, per oggi.</h2><p>${n} carte affrontate · ${good} ricordate bene</p><p>I prossimi ripassi sono stati programmati.<br>Le carte dimenticate torneranno tra 10 minuti.</p><div class="backup-actions" style="justify-content:center"><button class="btn" data-page="${scope==='mustn5'?'mustn5':'today'}">${scope==='mustn5'?'Torna a MUST N5':'Torna a Home'}</button><button class="btn secondary" data-action="start" data-scope="${scope}">Un’altra sessione</button></div></div>`;}
 const c=BY_ID.get(session.queue[session.index]),s=state(c.id);return `<div class="study-wrap study-active"><div class="session-top"><span>${s.status==='new'?'Nuovo incontro':statusLabel(s.status)}</span><span>Carta ${session.index+1} di ${session.queue.length}</span><button class="text-btn" data-page="today">Pausa</button></div><div class="progress-track"><span style="width:${session.index/session.queue.length*100}%"></span></div>${flipCard(c)}<div class="study-actions">${studyActions(s)}</div><label class="study-options"><input type="checkbox" id="romaji" ${data.settings.romaji?'checked':''}>Mostra romaji sul retro</label></div>`;}
function flipCard(c){const r=session.revealed,enter=session.enter,hide=' inert aria-hidden="true"',num=`<div class="card-number"><span>POCKETKANJI</span><span>#${String(c.order).padStart(3,'0')}</span></div>`;session.enter=false;return `<div class="flip-card${r?' flipped':''}${enter?' enter':''}"><div class="flip-tilt"><div class="flip-inner"><div class="flashcard flip-face front"${r?hide:''}>${num}<div class="front-body"><div class="big-kanji" lang="ja">${esc(c.kanji)}</div><p class="prompt">Qual è il significato? Come si legge?</p></div></div><div class="flashcard revealed flip-face back"${r?'':hide}>${num}<div class="big-kanji" lang="ja">${esc(c.kanji)}</div>${answer(c)}</div></div></div></div>`;}
function studyActions(s){return session.revealed?`<div class="rate-buttons"><button class="rate again" data-rate="again"><kbd class="kbd rate-key on-keys" aria-hidden="true">1</kbd>Non ricordavo<small>Tra 10 minuti</small></button><button class="rate hard" data-rate="hard"><kbd class="kbd rate-key on-keys" aria-hidden="true">2</kbd>Con fatica<small>Tra 1 giorno</small></button><button class="rate" data-rate="good"><kbd class="kbd rate-key on-keys" aria-hidden="true">3</kbd>Ricordavo bene<small>Tra ${nextGoodInterval(s)} ${nextGoodInterval(s)===1?'giorno':'giorni'}</small></button></div><p class="shortcut">Se ricordi solo lettura o significato, scegli “Non ricordavo”.</p>`:'<p class="shortcut flip-shortcut"><span class="on-keys">Premi <kbd class="kbd">Spazio</kbd> o <kbd class="kbd">Invio</kbd> per girare la carta.</span><span class="on-touch">Tocca la carta per girarla.</span></p>';}
function reveal(){if(!session||session.revealed||session.index>=session.queue.length)return;session.revealed=true;const card=$('.flip-card'),actions=$('.study-actions');if(!card||!actions){render();return;}card.classList.add('flipped');resetTilt();const[front,back]=card.querySelectorAll('.flip-face');front.setAttribute('inert','');front.setAttribute('aria-hidden','true');back.removeAttribute('inert');back.removeAttribute('aria-hidden');actions.innerHTML=studyActions(state(session.queue[session.index]));}
function nextGoodInterval(s){const sameDay=s.last&&dateKey(new Date(s.last))===dateKey(new Date());if(sameDay)return Math.max(1,s.interval||1);return [1,3,7,14,30,60,120,180][Math.min(s.streak,7)];}
function rate(rating){if(!session||!session.revealed||session.index>=session.queue.length)return;const id=session.queue[session.index],old=state(id),now=Date.now(),separateDay=!old.last||dateKey(new Date(old.last))!==dateKey(new Date(now));let s={...old,last:now};if(rating==='again'){s.streak=0;s.interval=0;s.status='learning';s.due=now+600000;}else if(rating==='hard'){s.streak=0;s.interval=1;s.status='learning';s.due=now+DAY;}else{s.interval=nextGoodInterval(old);s.streak=old.streak+(separateDay?1:0);s.status=s.streak>=3?'known':'learning';s.due=now+s.interval*DAY;}data.cards[id]=s;data.history.push({id,rating,at:now});save();session.ratings.push(rating);session.index++;session.revealed=false;session.enter=true;render();}
function renderProgress(){const n=counts(),h=data.history,total=h.length,good=h.filter(x=>x.rating==='good').length;const activity=Array.from({length:28},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(27-i));const k=dateKey(d),count=h.filter(x=>dateKey(new Date(x.at))===k).length;return `<span class="day" data-level="${count===0?0:count<5?1:count<15?2:3}" title="${k}: ${count} risposte" aria-label="${k}: ${count} risposte"></span>`;}).join('');return intro('Il tuo percorso','I progressi prendono forma.','Qui trovi ciò che hai incontrato, consolidato e da ritrovare.',`<div class="intro-actions"><button class="btn secondary small" data-action="csv">Esporta CSV ↓</button><button class="btn secondary small" data-page="profile">Backup e dati</button></div>`)+stats()+`<div class="columns"><section class="panel"><h2>La tua libreria, oggi</h2><div class="stack-bar" aria-hidden="true"><span class="known" style="width:${n.known/5}%"></span><span class="learning" style="width:${n.learning/5}%"></span></div>${[['known','Conosciute'],['learning','Da consolidare'],['new','Non studiate']].map(([id,label])=>`<div class="stack-row"><span class="status ${id}">${label}</span><b>${n[id]}</b></div>`).join('')}<p class="footnote">Una carta diventa conosciuta dopo 3 risposte “Ricordavo bene” in giorni diversi, senza errori o difficoltà tra loro. Continua poi a essere ripassata.</p></section><section class="panel"><h2>Un po’ ogni giorno</h2><div class="activity" aria-label="Attività degli ultimi 28 giorni">${activity}</div><div class="legend"><span>28 giorni fa</span><span>Oggi</span></div><div class="stack-row"><span>Carte diverse studiate oggi</span><b>${studiedToday()}</b></div><div class="stack-row"><span>Risposte complessive</span><b>${total}</b></div><div class="stack-row"><span>“Ricordavo bene” sul totale</span><b>${total?Math.round(good/total*100)+'%':'—'}</b></div><p class="footnote">Le statistiche descrivono queste carte, non la conoscenza generale del giapponese.</p></section></div><section class="panel" style="margin-top:20px"><h2>Ultimi incontri</h2>${h.length?`<table class="history"><thead><tr><th>Kanji</th><th>Significato</th><th>Quando</th><th>Risposta</th></tr></thead><tbody>${h.slice(-10).reverse().map(x=>{const c=BY_ID.get(x.id);return `<tr><td class="jp" lang="ja">${esc(c.kanji)}</td><td lang="en">${esc(c.meaning_en)}</td><td>${esc(new Date(x.at).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}))}</td><td>${{again:'Non ricordavo',hard:'Con fatica',good:'Ricordavo bene'}[x.rating]}</td></tr>`;}).join('')}</tbody></table>`:'<p class="prompt">La cronologia inizierà con la tua prima sessione.</p>'}</section>`;}

let persisted=null;
async function checkPersisted(){try{persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null;}catch(e){persisted=null;}if(page==='profile')render();}
async function protectStorage(notify=true){if(!navigator.storage||!navigator.storage.persist){if(notify)toast('Questo browser non permette di proteggere l’archivio. Esporta backup regolari.');return;}try{persisted=await navigator.storage.persist();}catch(e){persisted=false;}if(page==='profile')render();if(notify)toast(persisted?'Archivio protetto: il browser non lo cancellerà automaticamente.':'Il browser non ha concesso la protezione. Esporta backup regolari.');}

function goalMeter(){const p=data.profile;if(!p)return'';const done=studiedToday(),reached=done>=p.goal,pct=Math.min(100,Math.round(done/p.goal*100));return `<div class="goal-meter"><div class="goal-head"><span>${reached?'Obiettivo di oggi raggiunto':'Obiettivo di oggi'} · ${pct}%</span><b>${done} / ${p.goal} ${p.goal===1?'carta':'carte'}</b></div><div class="goal-bar" role="progressbar" aria-label="Obiettivo di oggi" aria-valuemin="0" aria-valuemax="${p.goal}" aria-valuenow="${Math.min(done,p.goal)}" aria-valuetext="${done} carte su ${p.goal}"><span style="width:${pct}%"></span></div></div>`;}
function backupSection(){let raw='';try{raw=localStorage.getItem(KEY)||'';}catch(e){}const days=data.lastBackup?Math.floor((Date.now()-Date.parse(data.lastBackup))/DAY):null,ago=days===null?'':days<1?' · oggi':days===1?' · ieri':` · ${days} giorni fa`,stale=data.history.length>0&&(days===null||days>14);return `<section class="panel" style="margin-top:20px" id="backup-section"><h2>I tuoi dati</h2><p class="prompt">Profilo, progressi e impostazioni sono salvati nel browser di questo computer. Esporta il backup per trasferirli, insieme alla libreria, su un altro computer.</p>${stale?'<div class="alert">È da un po’ che non esporti un backup. Salvane uno per non rischiare di perdere i progressi.</div>':''}<div class="stack-row"><span>Carte studiate</span><b>${Object.keys(data.cards).length}</b></div><div class="stack-row"><span>Risposte salvate</span><b>${data.history.length}</b></div><div class="stack-row"><span>Spazio occupato</span><b>${(new Blob([raw]).size/1024).toLocaleString('it-IT',{maximumFractionDigits:1})} KB</b></div><div class="stack-row"><span>Archivio protetto dal browser</span><b>${persisted===true?'Sì':persisted===false?'No · <button class="text-btn" data-action="persist">Proteggi i dati</button>':'Non disponibile'}</b></div><div class="backup-actions"><button class="btn" data-action="backup">Esporta backup ↓</button><button class="btn secondary" data-action="import">Importa backup ↑</button><button class="btn secondary" data-action="history-csv">Esporta cronologia CSV ↓</button></div><p class="footnote">Ultimo backup esportato: ${data.lastBackup?esc(new Date(data.lastBackup).toLocaleString('it-IT'))+ago:'nessuno'}<br>Google Drive non è ancora collegato. Puoi conservare manualmente il file su Drive.</p><details><summary>Come funziona questo prototipo</summary><p>Le 500 carte provengono dal tuo CSV e mantengono l’ordine originale. La programmazione dei ripassi usa intervalli semplici: 1, 3, 7, 14, 30, 60, 120 e 180 giorni per risposte ricordate bene. “Con fatica” programma un ripasso tra un giorno; “Non ricordavo” tra 10 minuti. Non viene usato FSRS.</p><p>Il backup contiene libreria, profilo, progressi e impostazioni. L’importazione richiede la stessa libreria e sostituisce i progressi attuali dopo conferma; se il backup non contiene un profilo, quello attuale resta invariato. In caso di differenze tra librerie, i dati non vengono importati.</p><p>Apri sempre lo stesso file nello stesso browser per ritrovare i progressi. La navigazione privata o la cancellazione dei dati del browser può eliminarli. “Proteggi i dati” chiede al browser di non cancellare l’archivio automaticamente quando lo spazio scarseggia.</p><p>La fonte e la revisione linguistica delle carte rimangono quelle della libreria fornita.</p></details></section>`;}
function profileFields(p,prefix){const avatar=p?p.avatar:AVATARS[0],goal=p?p.goal:10;return `<label class="field"><span>Nome</span><input id="${prefix}-name" name="name" maxlength="40" required autocomplete="nickname" placeholder="Come ti chiami?" value="${esc(p?p.name:'')}"></label><fieldset class="field"><legend>Avatar</legend><div class="avatar-picker">${AVATARS.map(k=>`<label title="${k}"><input type="radio" name="avatar" value="${k}" ${k===avatar?'checked':''} aria-label="${k}"><span lang="ja">${k}</span></label>`).join('')}</div></fieldset><div class="field"><label for="${prefix}-goal">Obiettivo giornaliero</label><div class="goal-input"><div class="goal-slider"><input type="range" min="0" max="${GOAL_STEPS.length-1}" step="1" value="${nearestStep(goal)}" style="--p:${nearestStep(goal)/(GOAL_STEPS.length-1)}" aria-label="Obiettivo giornaliero" aria-valuetext="${goal} carte al giorno" data-goal-range><div class="goal-scale" aria-hidden="true">${GOAL_STEPS.map((v,i)=>`<span class="${v===goal?'active':''}" style="left:calc(8px + (100% - 16px) * ${i/(GOAL_STEPS.length-1)})">${v}</span>`).join('')}</div></div><input type="number" id="${prefix}-goal" name="goal" min="1" max="100" step="1" inputmode="numeric" required value="${goal}" aria-describedby="${prefix}-goal-unit" data-goal-number><span class="goal-unit" id="${prefix}-goal-unit">carte al giorno</span></div></div>`;}
function renderProfile(){const p=data.profile,since=p?new Date(p.createdAt).toLocaleDateString('it-IT',{month:'long',year:'numeric'}):'',hasData=p||data.history.length||Object.keys(data.cards).length||loadError;return `<section class="profile-head"><span class="avatar large" aria-hidden="true">${avatarHtml(p)}</span><div><div class="eyebrow">${p?'Il tuo profilo':'Profilo locale'}</div><h1>${p?`Ciao, ${esc(p.name)}.`:'Crea il tuo profilo'}</h1><p>${p?`Su PocketKanji da ${esc(since)} · Dati salvati in questo browser`:'Dai un nome al tuo spazio. I progressi già fatti restano tuoi.'}</p></div></section><form class="panel profile-form" id="profile-form" data-profile-form><h2>${p?'Modifica profilo':'Il tuo profilo'}</h2>${profileFields(p,'profile')}<div><button class="btn" type="submit">${p?'Salva modifiche':'Crea profilo'}</button></div></form>`+backupSection()+(hasData?`<section class="panel danger-zone" style="margin-top:20px"><h2>${p?'Esci da questo browser':'Elimina i dati di questo browser'}</h2><p class="prompt">Elimina profilo, progressi e impostazioni salvati qui. Esporta prima un backup se vuoi riprenderli altrove.</p><button class="btn danger" data-action="logout">${p?'Esci ed elimina i dati':'Elimina i dati'}</button></section>`:'');}
function maybePromptProfile(){if(data.profile||loadError||!(data.history.length||Object.keys(data.cards).length))return;try{const later=Number(localStorage.getItem(PROMPT_KEY));if(later&&Date.now()-later<7*DAY)return;}catch(e){}const d=$('#welcome-dialog');d.innerHTML=`<div class="dialog-top"><h2 id="welcome-title">Completa il tuo profilo</h2><button class="close" type="button" data-action="close" aria-label="Più tardi">×</button></div><p>Su questo browser ci sono già <b>${Object.keys(data.cards).length} carte studiate</b> e <b>${data.history.length} risposte</b> della versione precedente di PocketKanji. Dai un nome al tuo spazio: i progressi restano tutti tuoi.</p><form class="profile-form" data-profile-form>${profileFields(null,'welcome')}<div class="backup-actions"><button class="btn secondary" type="button" data-action="close">Più tardi</button><button class="btn" type="submit">Crea profilo</button></div></form>`;d.showModal();}
function confirmLogout(){const d=$('#confirm-dialog'),p=data.profile;d.innerHTML=`<div class="dialog-top"><h2 id="confirm-title">${p?'Uscire ed eliminare i dati?':'Eliminare i dati?'}</h2><button class="close" data-action="close" aria-label="Annulla">×</button></div><p>${p?`Il profilo di <b>${esc(p.name)}</b>, `:''}${Object.keys(data.cards).length} carte studiate e ${data.history.length} risposte saranno eliminati da questo browser. L’operazione non si può annullare.</p><p class="prompt">Per riprenderli in seguito, esporta prima un backup.</p><div class="backup-actions"><button class="btn secondary" data-action="backup">Esporta backup ↓</button><button class="btn danger" data-action="confirm-logout">${p?'Esci ed elimina':'Elimina i dati'}</button></div>`;d.showModal();}
function logout(){try{localStorage.removeItem(KEY);}catch(e){toast('Non è stato possibile eliminare i dati da questo browser.');return;}data=fresh();loadError=false;storageOK=true;session=null;pendingImport=null;$('#confirm-dialog').close();applyTheme();go('today');toast('Dati eliminati. Ora sei ospite su questo browser.');}
function render(){nav();$('#storage-alert').innerHTML=storageOK?'':`<div class="alert">${loadError?'I dati salvati non sono leggibili. Non verranno sovrascritti. Importa un backup valido per riprendere.':'Il browser non consente il salvataggio. Esporta un backup prima di chiudere.'}</div>`;$('#view').innerHTML=page==='today'?renderToday():page==='library'?renderLibrary():page==='mustn5'?renderMustN5():page==='radicals'?renderRadicals():page==='study'?renderStudy():page==='profile'?renderProfile():renderProgress();account();addThemeToggle();addVoiceSettings();populateVoiceSelect();}
function go(p){stopSpeech();if(p==='radicals')radicalFamily=null;page=p;render();window.scrollTo({top:0});$('#view h1')?.setAttribute('tabindex','-1');$('#view h1')?.focus({preventScroll:true});}
function showCard(id){stopSpeech();const c=BY_ID.get(id),s=state(id),d=$('#card-dialog');d.dataset.card=id;d.innerHTML=`<div class="dialog-top"><span id="dialog-title">Carta #${String(c.order).padStart(3,'0')} · ${statusLabel(s.status)}</span><button class="close" data-action="close" aria-label="Chiudi scheda">×</button></div><div class="flashcard revealed"><div class="big-kanji" lang="ja">${esc(c.kanji)}</div>${answer(c)}</div>${s.due?`<p class="footnote">Prossimo ripasso: ${esc(new Date(s.due).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'}))}</p>`:'<p class="footnote">Non ancora studiata. Aprire questa scheda non modifica i progressi.</p>'}`;if(!d.open)d.showModal();}
function navigateLibraryCard(step){const d=$('#card-dialog');if(!d.open||!d.dataset.card)return;const index=CARDS.findIndex(c=>c.id===d.dataset.card),next=index+step;if(next<0||next>=CARDS.length)return;showCard(CARDS[next].id);}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportBackup(){const at=new Date().toISOString(),slug=(data.profile?data.profile.name:'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);const payload={app:'PocketKanji',...data,lastBackup:at,library:CARDS};download(JSON.stringify(payload,null,2),'pocketkanji-backup-'+(slug?slug+'-':'')+dateKey(new Date())+'.json','application/json');data.lastBackup=at;save();render();toast('Backup preparato. Conserva il file per trasferire i progressi.');}
function csvRow(row){return row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',');}
function exportCsv(historyOnly=false){const rows=historyOnly?[['id','kanji','reviewed_at','rating'],...data.history.map(h=>[h.id,BY_ID.get(h.id).kanji,new Date(h.at).toISOString(),h.rating])]:[['id','order','kanji','meaning_en','status','last_review','next_review','successful_days'],...CARDS.map(c=>{const s=state(c.id);return [c.id,c.order,c.kanji,c.meaning_en,s.status,s.last?new Date(s.last).toISOString():'',s.due?new Date(s.due).toISOString():'',s.streak];})];download('\ufeff'+rows.map(csvRow).join('\r\n'),'pocketkanji-'+(historyOnly?'cronologia':'progressi')+'-'+dateKey(new Date())+'.csv','text/csv;charset=utf-8');toast('CSV preparato per Excel o Google Sheets.');}
document.addEventListener('click',e=>{if(e.target.closest('.flip-card:not(.flipped)')){reveal();return;}const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.speak!==undefined){speakJapanese(b.dataset.speak,b);return;}if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.radical){radicalFamily=b.dataset.radical;render();window.scrollTo({top:0});return;}if(b.dataset.card){showCard(b.dataset.card);return;}if(b.dataset.filter){filter=b.dataset.filter;libraryPage=0;render();return;}if(b.dataset.rate){rate(b.dataset.rate);return;}switch(b.dataset.action){case'radicals-back':radicalFamily=null;render();window.scrollTo({top:0});break;case'start':startSession(b.dataset.scope||'all');break;case'prev':libraryPage--;render();window.scrollTo({top:0});break;case'next':libraryPage++;render();window.scrollTo({top:0});break;case'close':stopSpeech();b.closest('dialog').close();break;case'backup-page':go('profile');break;case'persist':protectStorage();break;case'logout':confirmLogout();break;case'confirm-logout':logout();break;case'backup':exportBackup();break;case'csv':exportCsv();break;case'history-csv':exportCsv(true);break;case'import':$('#backup-file').click();break;case'confirm-import':if(pendingImport){data={...pendingImport,profile:pendingImport.profile||data.profile};pendingImport=null;loadError=false;save();recordAccess();applyTheme();session=null;$('#import-dialog').close();go('progress');toast('Backup importato. I tuoi progressi sono pronti.');}break;}});
$('#card-dialog').addEventListener('click',e=>{const d=e.currentTarget,r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){stopSpeech();d.close();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;libraryPage=0;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('change',async e=>{if(e.target.id==='group'){group=e.target.value;libraryPage=0;render();}if(e.target.id==='romaji'){data.settings.romaji=e.target.checked;save();render();}if(e.target.id==='backup-file'){const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>25000000)throw Error('Il file supera 25 MB.');const raw=JSON.parse(await f.text());const sameLibrary=Array.isArray(raw.library)&&raw.library.length===CARDS.length&&raw.library.every((c,i)=>c&&c.id===CARDS[i].id&&String(c.order)===String(CARDS[i].order)&&c.kanji===CARDS[i].kanji);
if(raw.app!=='PocketKanji'||!sameLibrary)throw Error('La libreria del backup non corrisponde a questa versione di PocketKanji.');pendingImport=validateBackup(raw);const count=Object.keys(pendingImport.cards).length,newest=Math.max(0,...pendingImport.history.map(h=>h.at)),currentNewest=Math.max(0,...data.history.map(h=>h.at));$('#import-dialog').innerHTML=`<div class="dialog-top"><h2 id="import-title">Importare questo backup?</h2><button class="close" data-action="close" aria-label="Annulla importazione">×</button></div>${pendingImport.profile?`<p>Backup di <b>${esc(pendingImport.profile.name)}</b>.</p>`:''}<p>Contiene ${count} carte studiate e ${pendingImport.history.length} risposte.</p><p class="prompt">Ultima risposta nel backup: ${newest?esc(new Date(newest).toLocaleString('it-IT')):'nessuna'}</p>${newest<currentNewest?'<div class="alert">Il backup contiene una cronologia meno recente di quella attuale.</div>':''}<p>I progressi attuali saranno sostituiti${!pendingImport.profile&&data.profile?'; il tuo profilo resterà invariato':''}. Per conservarli, annulla ed esporta prima un backup.</p><div class="backup-actions"><button class="btn secondary" data-action="close">Annulla</button><button class="btn" data-action="confirm-import">Sostituisci e importa</button></div>`;$('#import-dialog').showModal();}catch(err){pendingImport=null;toast('Importazione annullata: '+err.message);}}});
const flipHint=$('#flip-hint'),reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');let tiltCard=null;
function resetTilt(){if(tiltCard){tiltCard.style.removeProperty('--rx');tiltCard.style.removeProperty('--ry');tiltCard=null;}flipHint.classList.remove('show');}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const card=e.target.closest('.flip-card:not(.flipped)');if(card!==tiltCard)resetTilt();if(!card)return;tiltCard=card;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;if(!reduceMotion.matches){card.style.setProperty('--rx',`${(-y*6).toFixed(2)}deg`);card.style.setProperty('--ry',`${(x*8).toFixed(2)}deg`);}flipHint.style.translate=`${e.clientX+16}px ${e.clientY+18}px`;flipHint.classList.add('show');});
document.documentElement.addEventListener('mouseleave',resetTilt);
document.addEventListener('keydown',e=>{const cardDialog=$('#card-dialog');if(cardDialog.open&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();navigateLibraryCard(e.key==='ArrowLeft'?-1:1);return;}if(page!=='study'||!session||session.index>=session.queue.length||document.querySelector('dialog[open]')||/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(document.activeElement.tagName))return;if(!session.revealed&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();reveal();}else if(session.revealed&&['1','2','3'].includes(e.key)){e.preventDefault();rate({1:'again',2:'hard',3:'good'}[e.key]);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="test-voice"]');if(b)speakJapanese('こんにちは。いっしょに日本語を勉強しましょう。',b);});
const SIDEBAR_KEY='pocketkanji-sidebar';applySidebar(loadSidebar());
document.addEventListener('click',e=>{if(!e.target.closest('[data-action="sidebar-toggle"]'))return;const collapsed=!document.documentElement.classList.contains('sidebar-collapsed');applySidebar(collapsed);try{localStorage.setItem(SIDEBAR_KEY,collapsed?'collapsed':'expanded');}catch(e){}});
document.addEventListener('click',e=>{if(!e.target.closest('[data-action="theme-toggle"]'))return;data.settings.theme=data.settings.theme==='dark'?'light':'dark';save();applyTheme();});
document.addEventListener('change',e=>{if(e.target.id==='voice-select'){data.settings.voiceURI=e.target.value;save();stopSpeech();toast('Voce giapponese salvata.');}});
document.addEventListener('submit',e=>{if(!e.target.matches('[data-profile-form]'))return;e.preventDefault();const f=new FormData(e.target),creating=!data.profile,first=[...data.accessDays].sort()[0];let profile;try{profile=cleanProfile({name:String(f.get('name')||''),avatar:f.get('avatar'),goal:Number(f.get('goal')),createdAt:data.profile?data.profile.createdAt:(first?new Date(first+'T12:00:00'):new Date()).toISOString()});}catch(err){toast('Scrivi un nome valido, fino a 40 caratteri.');e.target.querySelector('[name=name]')?.focus();return;}data.profile=profile;if(!save())return;e.target.closest('dialog')?.close();render();toast(creating?`Profilo creato. Ciao, ${profile.name}!`:'Profilo aggiornato.');if(creating)protectStorage(false);});
document.addEventListener('input',e=>{const form=e.target.closest('[data-profile-form]');if(!form)return;const range=form.querySelector('[data-goal-range]'),num=form.querySelector('[data-goal-number]');if(e.target===range){num.value=GOAL_STEPS[range.value];syncGoal(form,GOAL_STEPS[range.value]);}else if(e.target===num){const v=Number(num.value);if(Number.isInteger(v)&&v>=1&&v<=100)syncGoal(form,v);}});
document.addEventListener('change',e=>{if(!e.target.matches('[data-goal-number]'))return;const num=e.target,v=Math.round(Number(num.value)),goal=Number.isFinite(v)&&num.value!==''?Math.min(100,Math.max(1,v)):10;num.value=goal;syncGoal(num.closest('form'),goal);});
$('#welcome-dialog').addEventListener('close',()=>{if(!data.profile)try{localStorage.setItem(PROMPT_KEY,String(Date.now()));}catch(e){}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{data=e.newValue?validateBackup(JSON.parse(e.newValue)):fresh();loadError=false;storageOK=true;applyTheme();render();}catch(err){}});
if(speechAvailable()&&typeof window.speechSynthesis.addEventListener==='function')window.speechSynthesis.addEventListener('voiceschanged',populateVoiceSelect);
recordAccess();
applyTheme();
render();
checkPersisted();
maybePromptProfile();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
